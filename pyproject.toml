[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "walmart-kayaks"
version = "0.1.0"
description = "Walmart kayak tracker: discovery, daily monitoring, alerts, dashboard"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.40.0",
  "beautifulsoup4>=4.11.1",
  "tenacity>=8.2.2",
  "requests>=2.28.0",
]
